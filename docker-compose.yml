version: '3.8'

services:
  telegram-bot:
    build: ./services/telegram-bot
    env_file:
      - .env
    volumes:
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  router-bot:
    build: ./services/router-bot
    env_file:
      - .env
    restart: unless-stopped
